<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="My Web Design by HTML TailwindCSS — ผลงานออกแบบเว็บไซต์ โดย Sakda Wangsuk"
    />
    <title>My Web Design by HTML TailwindCSS</title>

    <!-- Favicon -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%2391ffb2'/></svg>"
    />

    <!-- Google Fonts: Roboto Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              mint: "#91ffb2",
            },
            fontFamily: {
              mono: ['"Roboto Mono"', "monospace"],
            },
            screens: {
              desktop: "1101px",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="flex min-h-screen flex-col items-center justify-between bg-mint p-[30px] pt-[50px] pb-[40px] font-mono text-black"
  >
    <main
      class="my-auto flex w-full max-w-[1280px] flex-col items-center justify-center gap-10 desktop:flex-row desktop:items-stretch desktop:gap-7"
    >
      <!-- ================= Section 1 (คอลัมน์ซ้าย): ข้อความ + ภาพแนวนอน 2 ภาพ ================= -->
      <section
        class="flex w-full max-w-full flex-1 flex-col justify-between items-center text-center desktop:max-w-[680px] desktop:flex-[1.6] desktop:items-start desktop:text-left"
      >
        <div class="flex flex-col items-center desktop:items-start">
          <h1
            class="m-0 text-[2.4rem] font-bold leading-[1.15] tracking-[-0.5px] text-black sm:text-[2.9rem]"
          >
            My Web Design by<br />
            HTML TailwindCSS
          </h1>

          <p
            class="my-6 text-[1.05rem] font-normal leading-[1.55] text-black md:my-7"
          >
            Lorem ipsum dolor sit amet,<br />
            consectetur adipiscing elit.<br />
            Cursus imperdiet sed id elementum.<br />
            Quam vel aliquam sit vulputate.
          </p>

          <a
            href="#projects"
            class="inline-block cursor-pointer rounded-full bg-[#333333] px-[38px] py-3 font-mono text-[1.1rem] font-semibold text-white shadow-md transition-all hover:bg-black hover:shadow-lg active:scale-95"
          >
            Follow Me
          </a>
        </div>

        <!-- การ์ดภาพ 2 ภาพแนวนอน (web3.png = page_a, web4.png = page_b) -->
        <div
          id="projects"
          class="mt-9 flex w-full justify-center gap-5 desktop:justify-start"
        >
          <a
            href="../page_a.html"
            title="เปิดดูหน้าผลงาน Page A"
            class="block flex-1 overflow-hidden rounded-lg shadow-md transition-all duration-300 hover:scale-[1.03] hover:shadow-xl"
          >
            <img
              src="web3.png?v=2"
              alt="ผลงานหน้า Portfolio Page A (Somrak Sudyodjing)"
              class="block h-auto w-full object-cover"
              onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='images/web3.png?v=2';}"
            />
          </a>

          <a
            href="../page_b.html"
            title="เปิดดูหน้าผลงาน Page B"
            class="block flex-1 overflow-hidden rounded-lg shadow-md transition-all duration-300 hover:scale-[1.03] hover:shadow-xl"
          >
            <img
              src="web4.png?v=2"
              alt="ผลงานหน้า Portfolio Page B (Sombat Jaideemak)"
              class="block h-auto w-full object-cover"
              onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='images/web4.png?v=2';}"
            />
          </a>
        </div>
      </section>

      <!-- ================= Section 2 (คอลัมน์กลาง): ภาพแนวตั้ง webprofile.png ================= -->
      <section class="flex items-stretch justify-center">
        <a
          href="../page_c.html"
          title="เปิดดูหน้าผลงาน Page C"
          class="block overflow-hidden rounded-lg shadow-md transition-all duration-300 hover:scale-[1.03] hover:shadow-xl"
        >
          <img
            src="webprofile.png"
            alt="ผลงานหน้าเว็บ Profile Page C (Chanintorn C.)"
            class="block h-auto max-h-[480px] w-auto max-w-full object-contain desktop:h-[560px] desktop:max-h-none"
            onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='images/webprofile.png';}"
          />
        </a>
      </section>

      <!-- ================= Section 3 (คอลัมน์ขวา): ภาพแนวตั้ง wenprofile2.png ================= -->
      <section class="flex items-stretch justify-center">
        <a
          href="../page_d.html"
          title="เปิดดูหน้าผลงาน Page D"
          class="block overflow-hidden rounded-lg shadow-md transition-all duration-300 hover:scale-[1.03] hover:shadow-xl"
        >
          <img
            src="wenprofile2.png"
            alt="ผลงานหน้าเว็บร้านอาหาร Page D (Bakery & Treats)"
            class="block h-auto max-h-[480px] w-auto max-w-full object-contain desktop:h-[560px] desktop:max-h-none"
            onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='images/wenprofile2.png';}"
          />
        </a>
      </section>
    </main>

    <!-- ================= Footer ================= -->
    <footer class="mt-11 text-center">
      <p class="my-1 text-[0.95rem] font-medium text-black">
        (รูปและเนื้อหาทั้งหมดใช้เพื่อการศึกษาเท่านั้น)
      </p>
      <p class="my-1 text-[0.95rem] font-medium text-black">
        Created by Sakda Wangsuk
      </p>
      <p class="my-1 text-[0.95rem] font-medium text-black">
        Copyright &copy; 2026 Sakda Wangsuk
      </p>
    </footer>
  </body>
</html>
